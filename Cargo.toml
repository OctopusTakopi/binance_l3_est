[package]
name = "binance_l3_est"
version = "0.5.0"
edition = "2024"
authors = ["OctopusTakopi"]
repository = "https://github.com/OctopusTakopi/binance_l3_est"
readme = "README.md"
license = "MIT"
keywords = ["order book", "binance", "trading", "hft", "visualization"]

[dependencies]
# WGPU selects Metal, Vulkan, or Direct3D for the host platform.
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
# eframe's wgpu feature only enables the `metal` + `webgpu` backends, so on
# Linux/Windows wgpu ends up with no usable backend and panics at startup.
# Vulkan covers Linux + Windows; macOS keeps `metal` from eframe. This matches
# the backend set the released binaries have always shipped with.
wgpu = { version = "29.0", default-features = false, features = ["vulkan", "vulkan-portability"] }
egui = { version = "0.35.0", features = ["default"] }
jiff = { version = "0.2", features = ["serde"] }
smallstr = { version = "0.3", features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3.32"

env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
log = "0.4"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
egui_plot = "0.36.0"
rand = "0.10.2"
once_cell = "1.21.4"
rustfft = "6"
num-complex = "0.4"
thiserror = "2"
anyhow = "1"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
# Native window-system integration is only configurable on Linux.
eframe = { version = "0.35.0", default-features = false, features = ["wayland", "x11"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "order_book_bench"
harness = false

[[bench]]
name = "order_book_update_bench"
harness = false

[[bench]]
name = "order_book_comparison"
harness = false
